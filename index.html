<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>반갈 · 로그인</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <div class="wrap-narrow" style="padding-top:80px;">
      <div class="auth-head">
        <div class="auth-logo"></div>
        <h1>로그인</h1>
        <p>오늘도 세상을 반으로 갈라보자고</p>
      </div>
      <form class="card" id="loginForm" style="display:flex;flex-direction:column;gap:16px;" novalidate>
        <div class="field">
          <label class="lbl" for="email">이메일</label>
          <input class="input" type="email" id="email" placeholder="이메일을 입력하세요" autocomplete="email">
        </div>
        <div class="field">
          <label class="lbl" for="password">비밀번호</label>
          <input class="input" type="password" id="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password">
          <p class="hint">8자 이상, 대소문자·숫자·특수문자 포함</p>
        </div>
        <button class="btn btn-accent" type="submit" style="margin-top:4px;">로그인</button>
      </form>
      <button class="btn-text" onclick="location.href='signup.html'">계정이 없다면? <span style="color:var(--b);text-decoration:underline;">회원가입</span></button>
    </div>
  </main>
  <footer class="ft">반갈 BAN-GAL — 세상 모든 고민을 반으로 갈라드립니다</footer>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="shared/form-utils.js"></script>
  <script src="features/auth/login.js"></script>
</body>
</html>
