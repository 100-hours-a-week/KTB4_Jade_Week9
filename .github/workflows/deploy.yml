name: Frontend CD

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      image_tag:
        description: 롤백하거나 재배포할 기존 이미지 태그
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-production
  cancel-in-progress: false

env:
  DOCKER_IMAGE: jeongminju45/banteum-frontend
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v4

      - name: Determine image tag
        id: image
        shell: bash
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_IMAGE_TAG"
          else
            TAG="sha-${GITHUB_SHA::7}"
          fi

          if [[ ! "$TAG" =~ ^sha-[0-9a-f]{7,40}$ ]]; then
            echo "Invalid image tag: $TAG"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $TAG"

      - name: Setup Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 배포 실패 시 어떤 태그로 되돌려야 하는지 로그에 남기기 위해
      # 바꾸기 전 태그를 먼저 읽는다.
      - name: Read current frontend tag
        id: previous
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "read current frontend tag" \
            --parameters commands="[
              \"set -e\",
              \"cd /home/ubuntu/deploy\",
              \"grep '^FRONTEND_TAG=' .env\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text)

          PREVIOUS_TAG="${OUTPUT#*FRONTEND_TAG=}"
          PREVIOUS_TAG="${PREVIOUS_TAG//[$'\r\n']/}"

          echo "tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "Previous frontend tag: $PREVIOUS_TAG"

      - name: Deploy frontend through SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy frontend $IMAGE_TAG" \
            --parameters commands="[
              \"set -e\",
              \"exec 9>/var/lock/banteum-deploy.lock\",
              \"flock -w 300 9\",
              \"cd /home/ubuntu/deploy\",
              \"docker compose config -q\",
              \"grep -q '^FRONTEND_TAG=' .env\",
              \"sed -i 's/^FRONTEND_TAG=.*/FRONTEND_TAG=${IMAGE_TAG}/' .env\",
              \"grep '^FRONTEND_TAG=' .env\",
              \"docker compose pull frontend\",
              \"docker compose up -d --wait --wait-timeout 60 frontend\",
              \"docker compose ps frontend\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          # aws ssm wait 의 기본 대기는 5초 x 20회 = 100초다. 잠금 대기 300초와
          # --wait-timeout 60초를 합치면 넘길 수 있어 직접 폴링한다.
          DEADLINE=$((SECONDS + 600))
          STATUS=Pending

          while (( SECONDS < DEADLINE )); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || echo Pending)

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac

            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          if [[ "$STATUS" != "Success" ]]; then
            echo "SSM command finished with status: $STATUS"
            exit 1
          fi

      - name: Health check
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent https://banteum.click/ > /dev/null; then
              echo "Frontend deployment succeeded"
              exit 0
            fi

            echo "Health check attempt $attempt failed"
            sleep 5
          done

          echo "Frontend health check failed"
          exit 1

      - name: Report deployment failure
        if: failure()
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
          NEW_TAG: ${{ steps.image.outputs.tag }}
        shell: bash
        run: |
          echo "Frontend deployment failed"
          echo "New image tag: ${NEW_TAG:-unknown}"

          if [[ -z "$PREVIOUS_TAG" ]]; then
            echo "Previous image tag: unknown (배포 시작 전에 실패)"
            echo "EC2 상태는 변경되지 않았을 가능성이 높다."
            exit 0
          fi

          echo "Previous image tag: $PREVIOUS_TAG"
          echo ""
          echo "이 시점에 .env는 새 태그, 컨테이너는 이전 이미지일 수 있다."
          echo ""
          echo "수동 롤백 (권장): Actions 탭 -> Frontend CD -> Run workflow"
          echo "  Branch:    master"
          echo "  image_tag: $PREVIOUS_TAG"
          echo ""
          echo "EC2에서 직접 롤백:"
          echo "  cd /home/ubuntu/deploy"
          echo "  sed -i 's/^FRONTEND_TAG=.*/FRONTEND_TAG=$PREVIOUS_TAG/' .env"
          echo "  docker compose pull frontend"
          echo "  docker compose up -d frontend"
          echo "  docker compose ps frontend"
