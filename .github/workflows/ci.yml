name: Frontend CI

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
