<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>반갈 · 비밀번호 수정</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hd" id="header"></header>
  <main>
    <div class="wrap-narrow" style="padding-top:88px;">
      <h1 class="page-title" style="font-size:32px;margin-bottom:32px;">비밀번호 수정</h1>
      <form class="card" id="pwForm" style="display:flex;flex-direction:column;gap:16px;" novalidate>
        <div class="field">
          <label class="lbl" for="current">현재 비밀번호</label>
          <input class="input" type="password" id="current" placeholder="현재 비밀번호를 입력하세요" autocomplete="current-password">
          <p class="hint error" id="curError" hidden>현재 비밀번호와 다릅니다</p>
        </div>
        <div class="field">
          <label class="lbl" for="newPw">새 비밀번호</label>
          <input class="input" type="password" id="newPw" placeholder="새 비밀번호를 입력하세요" autocomplete="new-password">
          <p class="hint">8자 이상, 대소문자·숫자·특수문자 포함</p>
        </div>
        <div class="field">
          <label class="lbl" for="confirm">비밀번호 확인</label>
          <input class="input" type="password" id="confirm" placeholder="비밀번호를 한번 더 입력하세요" autocomplete="new-password">
          <p class="hint error" id="confirmError" hidden>동일한 비밀번호를 입력해 주세요</p>
        </div>
        <button class="btn btn-accent" type="submit" style="margin-top:4px;">수정하기</button>
      </form>
    </div>
  </main>
  <footer class="ft">반갈 BAN-GAL — 세상 모든 고민을 반으로 갈라드립니다</footer>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="shared/form-utils.js"></script>
  <script src="features/mypage/password.js"></script>
</body>
</html>
