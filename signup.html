<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>반갈 · 회원가입</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <div class="wrap-narrow" style="padding-top:56px;">
      <h1 class="page-title" style="font-size:32px;">회원가입</h1>
      <p class="page-sub">가입하고 갈라치기 시작</p>
      <form class="card" id="signupForm" novalidate>
        <div class="center">
          <label class="lbl">프로필 사진 <span class="req">*</span></label>
          <button type="button" class="avatar-upload" id="avatarUpload">+</button>
          <input type="file" id="avatarFile" accept="image/*" hidden>
          <p class="hint" id="avatarHint">5MB 이하 이미지를 선택해 주세요</p>
        </div>
        <div class="field">
          <label class="lbl" for="email">이메일 <span class="req">*</span></label>
          <input class="input" type="email" id="email" placeholder="이메일을 입력하세요" autocomplete="email">
        </div>
        <div class="field">
          <label class="lbl" for="password">비밀번호 <span class="req">*</span></label>
          <input class="input" type="password" id="password" placeholder="비밀번호를 입력하세요" autocomplete="new-password">
        </div>
        <div class="field">
          <label class="lbl" for="password2">비밀번호 확인 <span class="req">*</span></label>
          <input class="input" type="password" id="password2" placeholder="비밀번호를 한번 더 입력하세요" autocomplete="new-password">
          <p class="hint error" id="pwMismatch" hidden>동일한 비밀번호를 입력해 주세요</p>
        </div>
        <div class="field">
          <label class="lbl" for="nick">닉네임 <span class="req">*</span></label>
          <input class="input" type="text" id="nick" placeholder="닉네임을 입력하세요" maxlength="10">
          <p class="hint">2~10자, 띄어쓰기 없이 입력해 주세요</p>
        </div>
        <button class="btn btn-accent" type="submit" style="margin-top:16px;">회원가입</button>
      </form>
      <button class="btn-text" onclick="location.href='index.html'">로그인하러 가기</button>
    </div>
  </main>
  <footer class="ft">반갈 BAN-GAL — 세상 모든 고민을 반으로 갈라드립니다</footer>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/profile-images.js"></script>
  <script src="js/ui.js"></script>
  <script src="shared/form-utils.js"></script>
  <script src="features/auth/signup.js"></script>
</body>
</html>
