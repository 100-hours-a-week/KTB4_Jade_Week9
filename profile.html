<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>반갈 · 회원정보 수정</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hd" id="header"></header>
  <main>
    <div class="wrap-narrow" style="padding-top:60px;">
      <h1 class="page-title" style="font-size:32px;margin-bottom:32px;">회원정보 수정</h1>
      <form class="card" id="profileForm" novalidate>
        <div class="center">
          <label class="lbl">프로필 사진</label>
          <button type="button" class="avatar-lg" id="avatarBtn"><span id="avaInitial">?</span><span class="edit-tag">변경</span></button>
        </div>
        <div class="field">
          <label class="lbl" for="email">이메일</label>
          <div class="readonly" id="email"></div>
        </div>
        <div class="field">
          <label class="lbl" for="nick">닉네임</label>
          <input class="input" type="text" id="nick" maxlength="10">
          <p class="hint">2~10자, 띄어쓰기 없이 입력해 주세요</p>
        </div>
        <button class="btn btn-accent" type="submit" style="margin-top:16px;">수정하기</button>
      </form>
      <button class="link-danger" id="withdrawBtn">회원 탈퇴</button>
    </div>
  </main>
  <footer class="ft">반갈 BAN-GAL — 세상 모든 고민을 반으로 갈라드립니다</footer>

  <!-- 탈퇴 확인 모달 -->
  <div class="modal-overlay" id="withdrawModal" hidden>
    <div class="modal">
      <h2>탈퇴...? 진심임...?</h2>
      <p>탈퇴하면 그동안 갈라온<br>모든 반갈 기록이 사라져요.</p>
      <div class="modal-actions">
        <button class="btn btn-accent" id="withdrawCancel">더 갈래요</button>
        <button class="btn btn-primary" id="withdrawConfirm">탈퇴할래요</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="shared/form-utils.js"></script>
  <script src="features/mypage/profile.js"></script>
</body>
</html>
