<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>반갈 · 만들기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hd" id="header"></header>
  <main>
    <div class="wrap-form">
      <h1 class="page-title" style="font-size:32px;" id="formTitle">반갈 만들기</h1>
      <p class="page-sub">세상을 반으로 가를 질문을 던져봐</p>
      <form class="card" id="gameForm" style="display:flex;flex-direction:column;gap:20px;" novalidate>
        <div class="field">
          <label class="lbl" for="question">질문 <span class="req">*</span></label>
          <textarea class="textarea" id="question" rows="2" maxlength="40" placeholder="예) 평생 라면 금지 vs 평생 김치 금지"></textarea>
          <p class="hint">최대 40자, 잔인할수록 잘 갈림</p>
        </div>
        <div class="vs-inputs">
          <div class="opt-box a">
            <label><span class="tag a">A</span>선택지 A <span class="req">*</span></label>
            <input class="input" type="text" id="optionA" placeholder="첫 번째 선택지를 입력하세요">
          </div>
          <div class="opt-box b">
            <label><span class="tag b">B</span>선택지 B <span class="req">*</span></label>
            <input class="input" type="text" id="optionB" placeholder="두 번째 선택지를 입력하세요">
          </div>
        </div>
        <button class="btn btn-primary" type="submit" id="submitBtn">반갈 던지기 ⚡</button>
        <button class="btn-ghost" type="button" id="deleteBtn" hidden>이 반갈 삭제하기</button>
      </form>
    </div>
  </main>
  <footer class="ft">반갈 BAN-GAL — 세상 모든 고민을 반으로 갈라드립니다</footer>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="shared/form-utils.js"></script>
  <script src="features/articles/form.js"></script>
</body>
</html>
