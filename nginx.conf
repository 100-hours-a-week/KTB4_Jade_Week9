server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache-Control 이 없으면 브라우저가 Last-Modified 기준 휴리스틱 캐싱을
    # 적용한다(RFC 9111 4.2.2). 캐시 기간은 파일 나이에 비례하므로 한 버전을
    # 오래 유지한 뒤 배포하면 기존 방문자가 구 index.html 을 계속 들고 있고,
    # 사라진 해시 asset 을 요청해 404 를 받아 화면이 비게 된다.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # 해시가 파일명에 있으므로 장기 캐시가 안전하다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
