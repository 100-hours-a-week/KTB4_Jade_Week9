<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>반갈 · 게임 목록</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hd" id="header"></header>
  <main>
    <div class="wrap">
      <div class="list-hero">
        <div class="pill"><span class="dot"></span> 지금 <span id="totalVoters">0</span>명이 갈리는 중</div>
        <h1>세상 모든 논쟁,<br>여기서 <span class="a">반</span>으로 <span class="b">접수</span>한다</h1>
        <p>중립기어 금지. 무조건 한 쪽만 골라.</p>
        <button class="btn btn-primary" style="width:auto;padding:15px 30px;box-shadow:5px 5px 0 var(--ink);" onclick="location.href='create.html'">🔪 반갈 만들기</button>
      </div>
      <div class="games" id="games"></div>
      <div id="sentinel" style="height:1px;"></div>
      <div id="loader" class="load-more" hidden>
        <span class="spinner"></span> 더 많은 반갈 불러오는 중...
      </div>
    </div>
  </main>
  <footer class="ft">반갈 BAN-GAL — 세상 모든 고민을 반으로 갈라드립니다</footer>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/profile-images.js"></script>
  <script src="js/ui.js"></script>
  <script src="features/articles/list.js"></script>
</body>
</html>
